name: Deploy to EC2

# 통합문서 4장 기준: main 브랜치 merge 시 배포.
# develop 은 통합 브랜치라 배포하지 않는다 (CI 만 돈다).
on:
  push:
    branches: [main]
  workflow_dispatch:

# 배포는 동시에 두 개가 돌면 안 된다. 진행 중인 배포를 취소하지 않고 큐에 세운다.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: EC2 재배포
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production

    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v4

      - name: SSH 키 준비
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: 코드 전송 (rsync)
        run: |
          rsync -az --delete \
            --exclude='.git' --exclude='.github' --exclude='build' \
            --exclude='.gradle' --exclude='docs' --exclude='.env' \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            ./ ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:~/backend/

      - name: 서버 .env 작성 (GitHub Secrets 에서)
        # 값은 GitHub production 환경 Secrets 에서만 온다. 서버에는 권한 600 으로 저장된다.
        # 주의: 이 파일은 통째로 새로 쓴다. 서버에만 두던 값은 여기 있어야 다음 배포에서 지워지지 않는다.
        # 비밀 값은 환경변수로 받고 printf 로 쓴다 (셸이 값 안의 $ 나 ` 를 해석하지 않도록).
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          CLICKHOUSE_PASSWORD: ${{ secrets.CLICKHOUSE_PASSWORD }}
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          TMAP_APP_KEY: ${{ secrets.TMAP_APP_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
        run: |
          set -euo pipefail
          ENV_FILE="$RUNNER_TEMP/prod.env"
          umask 077
          {
            echo "POSTGRES_DB=commute_playlist"
            echo "POSTGRES_USER=commute"
            printf 'POSTGRES_PASSWORD=%s\n' "$POSTGRES_PASSWORD"
            printf 'JWT_SECRET=%s\n' "$JWT_SECRET"
            printf 'CLICKHOUSE_PASSWORD=%s\n' "$CLICKHOUSE_PASSWORD"
            printf 'OPENWEATHER_API_KEY=%s\n' "$OPENWEATHER_API_KEY"
            printf 'KAKAO_REST_API_KEY=%s\n' "$KAKAO_REST_API_KEY"
            printf 'TMAP_APP_KEY=%s\n' "$TMAP_APP_KEY"
            printf 'ANTHROPIC_API_KEY=%s\n' "$ANTHROPIC_API_KEY"
            echo "S3_BUCKET=onbeat-prod-banner-229385463624"
            echo "S3_REGION=ap-northeast-2"
            echo "S3_PUBLIC_BASE_URL=https://onbeat-prod-banner-229385463624.s3.ap-northeast-2.amazonaws.com"
            echo "RAW_S3_BUCKET=onbeat-prod-raw-229385463624"
            echo "RAW_S3_REGION=ap-northeast-2"
            echo "CORS_ALLOWED_ORIGINS=https://d7iao7vwjl5mi.cloudfront.net,https://d2w3hn5omhhtbo.cloudfront.net"
            printf 'GRAFANA_ADMIN_PASSWORD=%s\n' "$GRAFANA_ADMIN_PASSWORD"
          } > "$ENV_FILE"
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} "umask 077 && cat > ~/backend/.env" < "$ENV_FILE"
          rm -f "$ENV_FILE"

      - name: EC2 에서 재배포
        # ⚠️ 프리티어(t2/t3.micro, 1GB) OOM 주의:
        #    컨테이너가 돌고 있는 상태로 build 하면 메모리가 터져 Exit 137 이 난다.
        #    그래서 backend 를 먼저 stop → build → up 순서로 실행한다.
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} bash -euo pipefail <<'REMOTE'
            cd ~/backend
            docker compose -f docker-compose.prod.yml stop backend || true
            docker compose -f docker-compose.prod.yml build backend
            docker compose -f docker-compose.prod.yml up -d db kafka kafka-init clickhouse backend nginx
            docker image prune -f
          REMOTE

      - name: 배포 검증 (헬스 체크)
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} bash -euo pipefail <<'REMOTE'
            for i in $(seq 1 40); do
              if curl -sf http://localhost/api/v1/health > /dev/null; then
                echo "✅ 배포 성공 — 헬스 체크 통과"
                exit 0
              fi
              sleep 5
            done
            echo "❌ 헬스 체크 실패 — 최근 로그:"
            cd ~/backend && docker compose -f docker-compose.prod.yml logs --tail 80 backend
            exit 1
          REMOTE

      - name: 실패 시 로그 수집
        if: failure()
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} \
            "cd ~/backend && docker compose -f docker-compose.prod.yml ps && docker compose -f docker-compose.prod.yml logs --tail 120" || true
