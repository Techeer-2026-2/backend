spring:
  application:
    name: commute-playlist-backend

  flyway:
    # 기존 광고 테이블(public)과 독립적으로 랭킹 스키마만 관리한다.
    schemas: ranking
    default-schema: ranking
    locations: classpath:db/ranking

  profiles:
    default: local

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/commute_playlist}
    username: ${SPRING_DATASOURCE_USERNAME:cp_user}
    password: ${SPRING_DATASOURCE_PASSWORD:cp_password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # 운영에서는 절대 create/update 를 쓰지 않는다. 스키마는 마이그레이션으로 관리.
      ddl-auto: ${JPA_DDL_AUTO:validate}
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100
    open-in-view: false

  jackson:
    default-property-inclusion: non_null
    time-zone: Asia/Seoul

server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        # 배포 검증·모니터링용 최소 노출. NGINX 에서 외부 접근은 차단한다.
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true
  api-docs:
    path: /v3/api-docs
  default-produces-media-type: application/json

# ---------- 인증(JWT) ----------
jwt:
  # 서명 키(32바이트 이상). 기본값은 로컬·테스트 전용이며, 운영(prod)은 JWT_SECRET 환경변수가 없으면 기동하지 않는다.
  secret: ${JWT_SECRET:local-dev-only-jwt-secret-change-me-0123456789}
  access-token-minutes: 30
  refresh-token-days: 14

# ---------- CORS ----------
cors:
  # 브라우저에서 API 를 호출해도 되는 프론트 주소(쉼표로 구분). 기본값은 로컬 Vite 개발 서버.
  # 배포 시에는 CORS_ALLOWED_ORIGINS 환경변수로 실제 프론트 주소를 지정한다. '*' 는 쓰지 않는다.
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# ---------- 외부 API ----------
external:
  itunes:
    # 인증 불필요. CORS 미지원이라 프론트가 아닌 백엔드에서 호출한다.
    # country=KR 파라미터는 쓰지 않는다 — entity=song/album과 같이 쓰면 검색 결과가 0건으로 나오는
    # 버그가 있다 (예: country=KR&entity=song&term=IU → 0건, country 없이 호출하면 정상).
    base-url: https://itunes.apple.com
  openweather:
    base-url: https://api.openweathermap.org/data/2.5
    api-key: ${OPENWEATHER_API_KEY:}
  kakao:
    base-url: https://dapi.kakao.com
    rest-api-key: ${KAKAO_REST_API_KEY:}
  tmap:
    base-url: https://apis.openapi.sk.com
    app-key: ${TMAP_APP_KEY:}

logging:
  level:
    com.techeer.backend: ${LOG_LEVEL:INFO}
