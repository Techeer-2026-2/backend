# EC2 배포용 스택. deploy.yml 워크플로우가 이 파일로 기동한다.
# 로컬 compose와 다른 점: 포트를 외부에 직접 열지 않고 NGINX가 리버스 프록시,
# 프로필은 prod, 값은 EC2의 ~/backend/.env 에서 읽는다.
services:
  db:
    image: postgres:16-alpine
    container_name: cp-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: Asia/Seoul
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cp-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      # 비어 있으면 compose 가 배포 단계에서 바로 멈춘다(서버가 기본 키로 뜨는 일을 막는다).
      JWT_SECRET: ${JWT_SECRET:?EC2 의 ~/backend/.env 에 JWT_SECRET 을 설정하세요}
      # true 이면 로그인 토큰이 없는 요청에 한해 X-Member-Id 헤더를 임시로 받는다. 프론트가 로그인으로 전환하면 false.
      AUTH_LEGACY_MEMBER_HEADER: ${AUTH_LEGACY_MEMBER_HEADER:-true}
      OPENWEATHER_API_KEY: ${OPENWEATHER_API_KEY}
      KAKAO_REST_API_KEY: ${KAKAO_REST_API_KEY}
      # 브라우저에서 API 를 호출할 프론트 주소(쉼표 구분). EC2 의 ~/backend/.env 에 CORS_ALLOWED_ORIGINS 로 지정한다.
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      # 캠페인 배너 이미지 버킷. 권한은 키 대신 EC2 IAM 역할로 받는다(컨테이너라 메타데이터 hop limit 2 필요).
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-ap-northeast-2}
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:-}
    expose:
      - "8080"

  nginx:
    image: nginx:1.27-alpine
    container_name: cp-nginx
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  db-data:
