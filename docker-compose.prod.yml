# EC2 배포용 스택. deploy.yml 워크플로우가 이 파일로 기동한다.
# 로컬 compose와 다른 점: 포트를 외부에 직접 열지 않고 NGINX가 리버스 프록시,
# 프로필은 prod, 값은 EC2의 ~/backend/.env 에서 읽는다.
# 카프카·ClickHouse 는 같은 compose 네트워크 안에서만 접근한다 (포트를 열지 않음).
# ⚠️ 메모리: 프리티어(1GB)에서는 카프카·ClickHouse·DB·백엔드를 같이 올리기 어렵다. 서버 사양을 먼저 정한다.
services:
  db:
    image: postgres:16-alpine
    container_name: cp-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: Asia/Seoul
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # 광고 이벤트 브로커 (브로커 1대, 복제 1). 로컬 compose 와 같은 설정이고 포트는 열지 않는다.
  kafka:
    image: apache/kafka:3.8.0
    container_name: cp-kafka
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # 메모리 상한 (프리티어 대응). 필요하면 서버 사양에 맞춰 올린다.
      KAFKA_HEAP_OPTS: -Xms256m -Xmx256m
      TZ: Asia/Seoul
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20

  # 토픽 2개를 만든 뒤 끝난다 (재실행해도 안전). 보관 7일 = retention.ms 604800000.
  kafka-init:
    image: apache/kafka:3.8.0
    container_name: cp-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        for t in ad-impressed ad-clicked; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic $$t --partitions 3 --replication-factor 1
          /opt/kafka/bin/kafka-configs.sh --bootstrap-server kafka:9092 --entity-type topics --entity-name $$t --alter --add-config retention.ms=604800000
        done
    restart: "no"

  # 광고 집계용 ClickHouse. 앱이 기동할 때 classpath:clickhouse/*.sql 로 스키마를 만든다.
  clickhouse:
    image: clickhouse/clickhouse-server:26.8
    container_name: cp-clickhouse
    restart: unless-stopped
    environment:
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?EC2 의 ~/backend/.env 에 CLICKHOUSE_PASSWORD 를 설정하세요}
      TZ: Asia/Seoul
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --password \"$$CLICKHOUSE_PASSWORD\" --query 'SELECT 1' >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cp-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      clickhouse:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      # 비어 있으면 compose 가 배포 단계에서 바로 멈춘다(서버가 기본 키로 뜨는 일을 막는다).
      JWT_SECRET: ${JWT_SECRET:?EC2 의 ~/backend/.env 에 JWT_SECRET 을 설정하세요}
      # true 이면 로그인 토큰이 없는 요청에 한해 X-Member-Id 헤더를 임시로 받는다. 프론트가 로그인으로 전환하면 false.
      AUTH_LEGACY_MEMBER_HEADER: ${AUTH_LEGACY_MEMBER_HEADER:-true}
      OPENWEATHER_API_KEY: ${OPENWEATHER_API_KEY}
      KAKAO_REST_API_KEY: ${KAKAO_REST_API_KEY}
      # 경로 탐색(TMAP) · AI 성과 요약(Claude). 비어 있으면 해당 기능만 실패한다.
      TMAP_APP_KEY: ${TMAP_APP_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # 브라우저에서 API 를 호출할 프론트 주소(쉼표 구분). EC2 의 ~/backend/.env 에 CORS_ALLOWED_ORIGINS 로 지정한다.
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      # 캠페인 배너 이미지 버킷. 권한은 키 대신 EC2 IAM 역할로 받는다(컨테이너라 메타데이터 hop limit 2 필요).
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-ap-northeast-2}
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:-}
      # 재계산 원본 저장 버킷 (S3 원본 보관)
      RAW_S3_BUCKET: ${RAW_S3_BUCKET:-}
      RAW_S3_REGION: ${RAW_S3_REGION:-ap-northeast-2}
      # 광고 파이프라인 (compose 네트워크 안의 주소)
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      # 모니터링용 지표 노출 (Prometheus 가 내부 네트워크에서만 긁는다)
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,info,prometheus
      CLICKHOUSE_URL: jdbc:clickhouse://clickhouse:8123/default
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
    expose:
      - "8080"

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: cp-prometheus
    restart: unless-stopped
    depends_on:
      - backend
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=14d
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"

  grafana:
    image: grafana/grafana:11.2.0
    container_name: cp-grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?EC2 의 ~/backend/.env 에 GRAFANA_ADMIN_PASSWORD 를 설정하세요}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"

  nginx:
    image: nginx:1.27-alpine
    container_name: cp-nginx
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  db-data:
  kafka-data:
  clickhouse-data:
  prometheus-data:
  grafana-data:
