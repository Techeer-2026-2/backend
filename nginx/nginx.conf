upstream backend {
    server backend:8080;
}

# 로그인 없이 호출되는 API 의 반복 호출 제한 (IP 하나당 분당 60번).
# 배너 노출 수 부풀리기, 가짜 클릭, 카카오 API 키 한도 소진을 막는 최소 방어이다.
# 이 nginx 가 클라이언트에 직접 연결되어 있다고 가정한다. 앞에 로드밸런서가 생기면
# $remote_addr 가 로드밸런서 주소가 되므로 realip 설정이 필요하다.
limit_req_zone $binary_remote_addr zone=public_api:10m rate=60r/m;

server {
    listen 80;
    server_name _;

    # 업로드/요청 본문 한도 (배너 이미지 업로드 대비)
    client_max_body_size 10M;

    # 제한 대상: 배너 매칭, 클릭, 카카오 장소 검색. 한 IP 가 순간적으로 20번까지는 허용하고
    # 그 이상이면 429(Too Many Requests)로 응답한다. 출근길 정상 사용(1~2번)에는 영향이 없다.
    location ~ ^/api/v1/(banners/match|clicks|places/search)$ {
        limit_req          zone=public_api burst=20 nodelay;
        limit_req_status   429;
        proxy_pass         http://backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location / {
        proxy_pass         http://backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # actuator 는 외부에 노출하지 않는다 (배포 검증은 EC2 내부에서 수행)
    location /actuator/ {
        deny  all;
        return 403;
    }
}
